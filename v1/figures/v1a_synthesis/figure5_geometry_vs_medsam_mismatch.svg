<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px}.box{fill:#fff;stroke:#333;stroke-width:1.2}</style><title>Prompt geometry vs MedSAM mismatch</title><text x="550" y="35" text-anchor="middle" class="t">Figure 5. Prompt-level improvement does not guarantee downstream MedSAM improvement</text><text x="275" y="85" text-anchor="middle" class="h">Stage 1: prompt geometry</text><text x="825" y="85" text-anchor="middle" class="h">Stage 2: frozen MedSAM utility</text><text x="70" y="145" class="s">Mean tight-box IoU</text><text x="310" y="145" class="s">0.03285 → 0.03606</text><text x="500" y="145" text-anchor="end" class="h">+9.8%</text><text x="70" y="220" class="s">Median center error</text><text x="310" y="220" class="s">5.250 → 4.113</text><text x="500" y="220" text-anchor="end" class="h">−21.7%</text><text x="70" y="295" class="s">Expanded coverage</text><text x="310" y="295" class="s">0.1957 → 0.3363</text><text x="500" y="295" text-anchor="end" class="h">+71.9%</text><text x="70" y="370" class="s">Prompt success rate</text><text x="310" y="370" class="s">0.000 → 0.040</text><text x="500" y="370" text-anchor="end" class="h">+0.040</text><text x="600" y="145" class="s">Recovered mean Dice</text><text x="840" y="145" class="s">0.02620 → 0.02492</text><text x="1030" y="145" text-anchor="end" class="h">−0.001279</text><text x="600" y="220" class="s">Recovered TP pixels</text><text x="840" y="220" class="s">650 → 608</text><text x="1030" y="220" text-anchor="end" class="h">−42</text><text x="600" y="295" class="s">Recovered FP pixels</text><text x="840" y="295" class="s">19,374 → 28,509</text><text x="1030" y="295" text-anchor="end" class="h">+9,135</text><text x="600" y="370" class="s">Case-volume Dice</text><text x="840" y="370" class="s">0.853935 → 0.853540</text><text x="1030" y="370" text-anchor="end" class="h">−0.000395</text><rect x="110" y="485" width="880" height="95" rx="14" class="box"/><text x="550" y="522" text-anchor="middle" class="h">G6 passes the prompt-geometry gate, but recovered-slice Dice decreases and false-positive pixels rise.</text><text x="550" y="555" text-anchor="middle" class="s">Prompt geometry metrics are useful surrogates, but imperfect proxies for frozen-MedSAM utility.</text></svg>