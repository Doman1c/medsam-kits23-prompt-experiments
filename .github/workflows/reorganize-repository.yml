name: Reorganize repository by experiment version

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  reorganize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'repo-reorganization-v3'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reorganization branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Reorganize repository
        shell: bash
        run: |
          set -euo pipefail

          if [ -f v0/run_v0_experiment.py ]; then
            echo "Repository is already organized."
            exit 0
          fi

          mkdir -p v0 "v0.5" v1

          for file in environment_check.py prepare_kits23_2d.py run_v0_experiment.py requirements.txt pip_freeze.txt snapshot_manifest.json; do
            if [ -e "$file" ]; then
              git mv "$file" "v0/$file"
            fi
          done

          if [ -d selected_cases ]; then git mv selected_cases v0/selected_cases; fi
          if [ -d reports ]; then git mv reports v0/reports; fi

          if [ -d experiments/v05_prompt_robustness ]; then
            git mv experiments/v05_prompt_robustness "v0.5/prompt_robustness"
          fi
          rmdir experiments 2>/dev/null || true

          if [ -d v1a1 ]; then git mv v1a1 v1/v1a1; fi

          if [ -d results/v1a1 ]; then
            mkdir -p v1/v1a1
            git mv results/v1a1 v1/v1a1/results
          fi

          if [ -d results ]; then
            mkdir -p v0/results
            shopt -s nullglob dotglob
            for item in results/*; do git mv "$item" v0/results/; done
            shopt -u nullglob dotglob
            rmdir results 2>/dev/null || true
          fi

          if [ -d docs ]; then
            mkdir -p v1/v1a1/docs
            shopt -s nullglob dotglob
            for item in docs/*; do git mv "$item" v1/v1a1/docs/; done
            shopt -u nullglob dotglob
            rmdir docs 2>/dev/null || true
          fi

          python - <<'PY'
          from pathlib import Path
          import textwrap

          files = {
              "README.md": """
          # MedSAM Automatic Prompt Generation on KiTS23

          This repository contains a sequence of experiments for developing a lightweight, modular automatic spatial-prompt generator for frozen MedSAM on the KiTS23 kidney CT dataset.

          ## Experiment versions

          | Version | Purpose | Status |
          |---|---|---|
          | [V0](v0/) | Frozen-MedSAM prompt baseline | Complete |
          | [V0.5](v0.5/) | Bounding-box robustness analysis | Complete |
          | [V1a.1](v1/v1a1/) | Dual-kidney 2.5D automatic prompt generator | Validation complete |

          ## Repository structure

          ```text
          .
          ├── v0/
          │   ├── baseline scripts
          │   ├── reports
          │   ├── selected cases
          │   └── results
          ├── v0.5/
          │   └── prompt_robustness/
          └── v1/
              └── v1a1/
                  ├── scripts/
                  ├── v1a1/
                  ├── splits/
                  ├── docs/
                  └── results/
          ```

          ## V1a.1 validation-locked configuration

          ```text
          checkpoint      = epoch 6
          prediction      = smooth
          max_gap         = 0
          left threshold  = 0.20
          right threshold = 0.30
          box expansion   = 1.20
          ```

          ## Validation performance

          | Metric | Result |
          |---|---:|
          | Slice-level mean Dice | 0.8122 |
          | Slice-level median Dice | 0.9384 |
          | Case-level mean Dice | 0.8233 |
          | Overall oracle gap | 0.0587 |
          | Case-level oracle gap | 0.0683 |

          ## Current status

          - Orientation audit: complete
          - Canonical RAS conversion: complete
          - Dual-kidney tracking: complete
          - Dual-channel target generation: complete
          - Small-sample overfit check: passed
          - V1a.1 training: complete
          - Validation calibration: complete
          - Locked test evaluation: pending
          """,
              "v0/README.md": """
          # V0 — MedSAM Prompt Baseline

          V0 evaluates frozen MedSAM using manually derived and oracle spatial prompts on KiTS23 kidney CT slices.

          Main scripts:

          - `prepare_kits23_2d.py`
          - `run_v0_experiment.py`
          - `environment_check.py`

          Representative random-100 results:

          | Prompt mode | Mean Dice |
          |---|---:|
          | box_mask | 0.9460 |
          | box | 0.9414 |
          | all | 0.9272 |
          | box_pos | 0.8475 |
          | box_pos_neg | 0.6240 |
          """,
              "v0.5/README.md": """
          # V0.5 — Bounding-Box Prompt Robustness

          V0.5 studies how frozen MedSAM responds to imperfect bounding-box prompts.

          Main findings:

          - Box expansion around 1.10–1.25 is generally safe.
          - Approximately 5% center or corner error is usually tolerable.
          - Errors of 20% or greater cause substantial Dice degradation.
          - Very small edge slices remain difficult even with oracle prompts.
          """,
              "v1/README.md": """
          # V1 — Learned Automatic Prompt Generation

          V1 contains learned automatic spatial-prompt generation methods.

          ## Current implementation

          ### [V1a.1 Dual-Kidney Prompt Generator](v1a1/)

          V1a.1 uses 2.5D CT input and predicts left/right kidney presence, center heatmaps, center-local box sizes, offsets, and calibrated bounding boxes. The two boxes are passed separately to frozen MedSAM and the resulting masks are combined.
          """,
          }

          for path, content in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).strip() + "\n", encoding="utf-8")
          PY

          git rm -f .github/workflows/reorganize-repository.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganize repository by experiment version"
          git push origin HEAD:${{ github.head_ref }}
